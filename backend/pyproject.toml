[project]
name = "common-agent-backend"
version = "0.1.0"
description = "通用 Agent 中台后端"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.18.5",
    "aiomysql>=0.3.2,<0.4",
    "argon2-cffi>=25.1,<26",
    "cryptography>=49,<50",
    "deepagents==0.6.12",
    "fastapi>=0.139.2",
    "httpx>=0.28,<1",
    "httpcore>=1.0.9,<2",
    "langchain-openai>=1.3.5,<1.4",
    "langgraph==1.2.9",
    "mcp>=1.28.1,<2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32,<0.1",
    "pymysql>=1.1.1,<2",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn>=0.51.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/common_agent"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
patch = ["subprocess"]
relative_files = true
sigterm = true
source = ["common_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["common_agent"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
warn_unused_configs = true

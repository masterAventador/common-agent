name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.16
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install frozen backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Start isolated MySQL
        env:
          PLATFORM_DOCKER_CONTEXT: default
        run: ./infra/platform/manage.sh up

      - name: Run backend tests and coverage gate
        run: ./scripts/coverage.sh backend

      - name: Lint backend
        working-directory: backend
        run: uv run --frozen ruff check . ../scripts/check-backend-coverage.py

      - name: Check backend formatting
        working-directory: backend
        run: >-
          uv run --frozen ruff format --check
          --exclude migrations/versions/20260720_0005_workflow_runs.py
          . ../scripts/check-backend-coverage.py

      - name: Type-check backend
        working-directory: backend
        run: uv run --frozen mypy src tests ../scripts/check-backend-coverage.py

      - name: Verify backend lock file
        working-directory: backend
        run: uv lock --check

      - name: Audit backend dependencies
        working-directory: backend
        run: uv audit --frozen --preview-features audit

      - name: Stop isolated MySQL
        if: always()
        env:
          PLATFORM_DOCKER_CONTEXT: default
        run: ./infra/platform/manage.sh down

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frozen frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests and coverage gate
        working-directory: frontend
        run: pnpm test:coverage

      - name: Lint frontend
        working-directory: frontend
        run: pnpm lint

      - name: Type-check frontend
        working-directory: frontend
        run: pnpm typecheck

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Audit frontend dependencies
        working-directory: frontend
        run: pnpm audit --audit-level=high

  demo-and-contracts:
    name: Demo, contracts and infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout with fixed third-party sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.16
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frozen backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Install frozen frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install headless Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium-headless-shell

      - name: Check generated contracts
        working-directory: frontend
        run: pnpm contracts:check

      - name: Check infrastructure and entrypoint contracts
        env:
          COMMON_AGENT_TEST_DOCKER_CONTEXT: default
        run: |
          bash infra/ragflow/test-manage.sh
          bash infra/platform/test-manage.sh
          ./scripts/test-dev.sh
          ./scripts/test-real.sh
          ./scripts/test-ci.sh
          ./scripts/test-coverage.sh

      - name: Check shell scripts
        run: rg --files -g '*.sh' -g '!third_party/**' | xargs shellcheck

      - name: Run Demo browser acceptance
        working-directory: frontend
        env:
          COMMON_AGENT_E2E_DOCKER_CONTEXT: default
        run: pnpm test:e2e:demo

      - name: Stop Demo infrastructure
        if: always()
        env:
          PLATFORM_DOCKER_CONTEXT: default
        run: ./infra/platform/manage.sh down

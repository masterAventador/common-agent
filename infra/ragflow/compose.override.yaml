services:
  ragflow-cpu:
    container_name: common-agent-ragflow-api
    platform: linux/amd64
    mem_limit: 5g
    environment:
      COMPOSE_PROFILES: ${COMPOSE_PROFILES}
      DASHSCOPE_HTTP_BASE_URL: ${RAGFLOW_DASHSCOPE_HTTP_BASE_URL:-https://dashscope.aliyuncs.com/api/v1}
      DOC_BULK_SIZE: "32"
      # 仅 macOS 开发机置 1；Linux 部署留空以保留 update_progress 的分布式锁。
      MACOS: "${RAGFLOW_MACOS:-}"
      MAX_CONCURRENT_CHUNK_BUILDERS: "1"
      MAX_CONCURRENT_EMBEDDINGS: "8"
      MAX_CONCURRENT_TASKS: "5"
      RAGFLOW_IMAGE: ${RAGFLOW_IMAGE}
    volumes:
      - ${RAGFLOW_DATA_ROOT}/logs:/ragflow/logs
  es01:
    container_name: common-agent-ragflow-elasticsearch
    image: ${RAGFLOW_ELASTICSEARCH_IMAGE}
    mem_limit: 3g
    environment:
      ES_JAVA_OPTS: -Xms1g -Xmx1g
  mysql:
    container_name: common-agent-ragflow-mysql
    image: ${RAGFLOW_MYSQL_IMAGE}
    mem_limit: 2g
  minio:
    container_name: common-agent-ragflow-minio
    image: ${RAGFLOW_MINIO_IMAGE}
    mem_limit: 1g
  redis:
    container_name: common-agent-ragflow-valkey
    image: ${RAGFLOW_VALKEY_IMAGE}
    mem_limit: 256m
volumes:
  esdata01:
    name: common-agent-ragflow-esdata-v2
    driver: !reset null
    external: true
  mysql_data:
    name: common-agent-ragflow-mysql-data-v3
    driver: !reset null
    external: true
  minio_data:
    name: common-agent-ragflow-minio-data-v2
    driver: !reset null
    external: true
  redis_data:
    name: common-agent-ragflow-valkey-data-v2
    driver: !reset null
    external: true
